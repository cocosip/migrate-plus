name: Release

on:
  push:
    tags: ['v*']

permissions:
  contents: read

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

env:
  GOTOOLCHAIN: local
  CGO_ENABLED: "0"

jobs:
  release:
    name: Create Release
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - uses: actions/setup-go@v7
        with:
          go-version: '1.27.x'
          cache: true
      - name: Run tests
        run: go test -v ./... -count=1 -timeout 5m
      - name: Build packages
        run: go build ./...
      - name: Generate changelog
        shell: bash
        env:
          RELEASE_VERSION: ${{ github.ref_name }}
        run: |
          PREV_TAG=$(git describe --tags --abbrev=0 HEAD^ 2>/dev/null || git rev-list --max-parents=0 HEAD)
          {
            echo "## What's Changed"
            echo
            git log "${PREV_TAG}..HEAD" --pretty=tformat:"- %s" --no-merges
            echo
            echo "**Full Changelog**: https://github.com/${GITHUB_REPOSITORY}/compare/${PREV_TAG}...${RELEASE_VERSION}"
          } > CHANGELOG_BODY.md
      - name: Publish GitHub Release
        uses: softprops/action-gh-release@v3
        with:
          body_path: CHANGELOG_BODY.md
          prerelease: ${{ contains(github.ref_name, '-') }}
