name: Release

on:
  push:
    tags: ['v*']

permissions:
  contents: read

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

env:
  GOTOOLCHAIN: local
  CGO_ENABLED: "0"

jobs:
  checks:
    name: Release checks
    uses: ./.github/workflows/ci.yml

  release:
    name: Publish CLI archives
    needs: checks
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - uses: actions/setup-go@v7
        with:
          go-version: '1.27.x'
          cache: true
      - name: Build release archives
        env:
          RELEASE_VERSION: ${{ github.ref_name }}
        run: |
          for target in linux/amd64 linux/arm64 darwin/amd64 darwin/arm64 windows/amd64 windows/arm64; do
            export GOOS=${target%/*} GOARCH=${target#*/}
            archive="migrate-plus_${RELEASE_VERSION}_${GOOS}_${GOARCH}"
            package="dist/${archive}"
            binary=migrate-plus
            if [[ "$GOOS" == windows ]]; then binary+=.exe; fi
            mkdir -p "$package"
            go build -trimpath -ldflags "-s -w -X main.Version=${RELEASE_VERSION}" -o "${package}/${binary}" ./cmd/migrate-plus
            cp LICENSE THIRD_PARTY_NOTICES.md README.md "$package/"
            tar -czf "dist/${archive}.tar.gz" -C "$package" .
          done
          (cd dist && sha256sum *.tar.gz > checksums.txt)
      - name: Verify CLI version
        env:
          RELEASE_VERSION: ${{ github.ref_name }}
        run: test "$("dist/migrate-plus_${RELEASE_VERSION}_linux_amd64/migrate-plus" -version 2>&1)" = "$RELEASE_VERSION"
      - name: Generate changelog
        shell: bash
        env:
          RELEASE_VERSION: ${{ github.ref_name }}
        run: |
          PREV_TAG=$(git describe --tags --abbrev=0 HEAD^ 2>/dev/null || git rev-list --max-parents=0 HEAD)
          {
            echo "## What's Changed"
            echo
            git log "${PREV_TAG}..HEAD" --pretty=tformat:"- %s" --no-merges
            echo
            echo "**Full Changelog**: https://github.com/${GITHUB_REPOSITORY}/compare/${PREV_TAG}...${RELEASE_VERSION}"
          } > CHANGELOG_BODY.md
      - name: Publish GitHub Release
        uses: softprops/action-gh-release@v3
        with:
          files: |
            dist/*.tar.gz
            dist/checksums.txt
          fail_on_unmatched_files: true
          body_path: CHANGELOG_BODY.md
          prerelease: ${{ contains(github.ref_name, '-') }}
