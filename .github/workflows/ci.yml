name: CI

on:
  push:
    branches: [master, main, develop]
  pull_request:
  workflow_dispatch:
  workflow_call:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.event_name }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.event_name != 'workflow_dispatch' }}

env:
  GOTOOLCHAIN: local
  CGO_ENABLED: "0"

jobs:
  test:
    name: Test (${{ matrix.os }}, Go ${{ matrix.go }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
        go: ['1.27.x']
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v7
        with:
          go-version: ${{ matrix.go }}
          cache: true
      - name: Show toolchain
        run: go version
      - name: Download dependencies
        run: go mod download
      - name: Verify dependencies
        run: go mod verify
      - name: Build packages
        run: go build ./...
      - name: Vet
        run: go vet ./...
      - name: Compile integration tests without a database
        run: go test -tags=integration ./... -run '^$' -timeout 1m
      - name: Run tests with coverage
        run: go test "-coverprofile=coverage.out" -covermode=atomic ./... -count=1 -timeout 5m
      - name: Upload coverage
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@v7
        with:
          name: coverage-${{ matrix.os }}-go${{ matrix.go }}
          path: coverage.out
          if-no-files-found: error
          retention-days: 14

  build:
    name: Build (${{ matrix.goos }}/${{ matrix.goarch }})
    runs-on: ubuntu-latest
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        goos: [linux, darwin, windows]
        goarch: [amd64, arm64]
    env:
      GOOS: ${{ matrix.goos }}
      GOARCH: ${{ matrix.goarch }}
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v7
        with:
          go-version: '1.27.x'
          cache: true
      - name: Build all packages
        run: go build -trimpath ./...
      - name: Build CLI
        shell: bash
        env:
          BUILD_VERSION: ${{ github.sha }}
        run: |
          binary=migrate-plus
          if [[ "$GOOS" == windows ]]; then binary+=.exe; fi
          go build -trimpath -ldflags "-s -w -X main.Version=${BUILD_VERSION}" -o "dist/${binary}" ./cmd/migrate-plus
      - name: Upload CLI
        uses: actions/upload-artifact@v7
        with:
          name: migrate-plus-${{ matrix.goos }}-${{ matrix.goarch }}
          path: dist/*
          if-no-files-found: error
          retention-days: 14

  lint:
    name: Lint (${{ matrix.os }}, Go ${{ matrix.go }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
        go: ['1.27.x']
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v7
        with:
          go-version: ${{ matrix.go }}
          cache: true
      - name: Check formatting and module files
        if: runner.os == 'Linux'
        shell: bash
        run: |
          files=$(git ls-files -z '*.go' | xargs -0 gofmt -l)
          if [ -n "$files" ]; then
            printf 'Run gofmt on:\n%s\n' "$files"
            exit 1
          fi
          go mod tidy -diff
      - name: Check GitHub Actions workflows
        if: runner.os == 'Linux'
        run: go run github.com/rhysd/actionlint/cmd/actionlint@v1.7.12 -color
      - uses: golangci/golangci-lint-action@v9
        with:
          version: v2.14.0
          args: --timeout=10m ./...
